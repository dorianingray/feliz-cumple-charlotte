<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños Charlotte!</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        .heart-float {
            position: absolute;
            opacity: 0;
            animation: float-up 6s ease-in infinite;
        }
        @keyframes float-up {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-20vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="hearts-container"></div>
    
    <div class="container">
        <div class="birthday-card">
            <div class="heart-container">
                <svg class="heart" viewBox="0 0 32 29.6">
                    <path d="M23.6,0c-3.4,0-6.4,2.1-7.6,5.1C14.8,2.1,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4
                    c0,5.5,5.4,10.2,13.5,17.1l2.5,2.1l2.5-2.1C26.6,18.6,32,13.9,32,8.4C32,3.8,28.2,0,23.6,0z"/>
                </svg>
                <div class="glow"></div>
            </div>
            <h1>¡Feliz Cumpleaños Charlotte!</h1>
            <a href="mensaje-especial.html" class="btn">Mensaje Especial</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
